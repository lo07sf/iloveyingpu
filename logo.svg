<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200">
  <title>我愛螢圃里</title>
  <!-- 老城南印章風木棉花（自行繪製）：磚紅圓印＋米白五瓣剪影 -->
  <defs>
    <path id="p" d="M0,0 C10,-5 17,-22 12,-36 C9,-44 3,-48 0,-49 C-3,-48 -9,-44 -12,-36 C-17,-22 -10,-5 0,0Z"/>
  </defs>
  <circle cx="100" cy="100" r="92" fill="#a3412b"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#fffaf0" stroke-width="3"/>
  <g transform="translate(100,96) scale(1.15)" fill="#fffaf0">
    <use xlink:href="#p" href="#p"/>
    <use xlink:href="#p" href="#p" transform="rotate(72)"/>
    <use xlink:href="#p" href="#p" transform="rotate(144)"/>
    <use xlink:href="#p" href="#p" transform="rotate(216)"/>
    <use xlink:href="#p" href="#p" transform="rotate(288)"/>
  </g>
  <g transform="translate(100,96)" fill="#a3412b">
    <circle r="8"/>
    <circle r="3.2" transform="rotate(36) translate(0,-17)"/>
    <circle r="3.2" transform="rotate(108) translate(0,-17)"/>
    <circle r="3.2" transform="rotate(180) translate(0,-17)"/>
    <circle r="3.2" transform="rotate(252) translate(0,-17)"/>
    <circle r="3.2" transform="rotate(324) translate(0,-17)"/>
  </g>
</svg>
